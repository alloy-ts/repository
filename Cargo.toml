[package]
name = "repository"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gix = { version = "0.89.0", features = ["revision", "merge", "blob-diff", "blame", "attributes", "status", "worktree-mutation", "blocking-network-client"] }
napi = { version = "3.14.2", features = ["serde-json"] }
napi-derive = "3.6.12"
futures = "0.3.34"
serde = { version = "1.0.154", features = ["derive"] }
serde_json = "1.0.154"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"

[build-dependencies]
napi-build = "2.6.0"
