[package]
name = "repository"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gix = { version = "0.89.0", features = [
  "revision",
  "merge",
  "blob-diff",
  "blame",
  "attributes",
  "excludes",
  "command",
  "mailmap",
  "dirwalk",
  "status",
  "worktree-mutation",
  "worktree-stream",
  "sha256",
  "blocking-network-client",
] }
gix-chunk = "0.10.0"
gix-negotiate = "0.37.0"
gix-pack = "0.76.0"
gix-filter = "0.36.0"
gix-imara-diff = "0.3.1"
gix-protocol = { version = "0.67.0", features = ["blocking-client", "fetch"] }
filetime = "0.2.29"
napi = { version = "3.14.2", features = ["serde-json", "tokio_rt", "napi5"] }
napi-derive = "3.6.12"
futures = { version = "0.3.34", features = ["async-await", "executor"] }
futures-executor = { version = "0.3.34", features = ["thread-pool"] }
futures-channel = "0.3.34"
serde = { version = "1.0.154", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4.3"
regex = "1"
thiserror = "2.0.21"
multi-key = { version = "2.0.0", optional = true }
multi-sig = { version = "2.0.0", optional = true }
rustls = { version = "0.23.46", optional = true }
multi-codec = { version = "1.6", optional = true }
btls = { version = "0.5", optional = true }
sequoia-openpgp = { version = "1", optional = true, default-features = false, features = [
  "crypto-rust",
  "compression",
  "allow-experimental-crypto",
  "allow-variable-time-crypto",
] }
anyhow = { version = "1", optional = true }
zeroize = "1.9.1"
chacha20poly1305 = "0.11"
rand = "0.8"
argon2 = "0.5"
tokio = { version = "1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "time",
  "process",
  "io-util",
  "sync",
] }
ring = "0.17.14"
reqwest = { version = "0.13.5", features = [
  "query",
  "stream",
  "blocking",
  "rustls",
  "multipart",
  "deflate",
] }
object_store = { version = "0.14.2", default-features = false, features = [
  "fs",
  "http",
  "reqwest",
  "cloud-base",
  "ring",
] }
fjall = "3.1.12"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
pgp = "0.21.0"
blake3 = "1"
crc32fast = "1"

[build-dependencies]
napi-build = "2.6.0"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
nix = "0.31.3"
libc = "0.2"
libuv = "2.15.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
] }

[features]
default = ["crypto"]
# SSH recipient-key sharing via ed25519 keys.
ssh = ["dep:multi-codec"]
# GPG recipient-key sharing (keyring lookup currently a stub).
gpg = ["crypto", "dep:sequoia-openpgp", "dep:anyhow"]
# Post-quantum signatures.
xmss = []
crypto = []
# Write-ahead log napi-binding scaffold (see src/wal.rs). Off by default until the
# core dependencies it names are available.
wal = ["record"]
# `Record` napi class (see src/record.rs).
record = []
# Filesystem-seam napi bindings (see src/fs.rs).
fs = []
# Content store napi-binding scaffold (see src/content_store.rs). Enables `wal` for the
# WAL-backed write path, which in turn enables `record`.
store = ["wal"]
rustls = ["dep:rustls"]
# DataFusion napi-binding scaffold (see src/task_service.rs, src/df_thread.rs,
# src/df_worker.rs). The modules are inert unless this feature is enabled AND
# the `datafusion`, `moka` and `url` crates are available — they belong to the
# DataFusion project, not this git library.
datafusion = []
