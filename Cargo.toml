[package]
name = "repository"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gix = { version = "0.89.0", features = [
  "revision",
  "merge",
  "blob-diff",
  "attributes",
  "status",
  "worktree-mutation",
  "blocking-network-client",
  "command",
] }
napi = { version = "3.14.2", features = ["serde-json"] }
napi-derive = "3"
futures = "0.3"
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2.6.0"
