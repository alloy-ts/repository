[package]
name = "repository"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gix = { version = "0.89.0", features = [
  "revision",
  "merge",
  "blob-diff",
  "blame",
  "attributes",
  "command",
  "mailmap",
  "dirwalk",
  "status",
  "worktree-mutation",
  "worktree-stream",
  "sha256",
  "blocking-network-client",
] }
gix-chunk = "0.10.0"
gix-pack = "0.76.0"
gix-filter = "0.36.0"
gix-imara-diff = "0.3.1"
gix-protocol = { version = "0.67.0", features = ["blocking-client"] }
filetime = "0.2.29"
napi = { version = "3.14.2", features = ["serde-json"] }
napi-derive = "3.6.12"
futures = "0.3.34"
serde = { version = "1.0.154", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4.3"
thiserror = "2.0.21"
multi-key = "2.0.0"
multi-sig = "2.0.0"
multi-util = "1.2.0"
blsful = "4.1.0"
zeroize = "1.9.1"
chacha20poly1305 = "0.11"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
hkdf = "0.12"
pbkdf2 = "0.12"
ed25519-dalek = "2.1"
sha1 = "0.10"
aes = "0.8"
cbc = "0.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "jwk"] }
rsa = { version = "0.9", features = ["sha2"] }

[build-dependencies]
napi-build = "2.6.0"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
# SSH recipient-key sharing via ed25519 keys.
ssh = []
# GPG recipient-key sharing (keyring lookup currently a stub).
gpg = []
# Post-quantum signatures.
xmss = []
