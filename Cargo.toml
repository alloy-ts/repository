[workspace]
resolver = "3"
members = ["sources/*"]
default-members = ["sources/repository"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
repository-bindings = { package = "repository", path = "sources/repository" }

[patch.crates-io]
http-request = { path = "vendor/http-request" }
