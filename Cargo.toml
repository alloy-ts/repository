[package]
name = "repository"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gix = { version = "0.89.0", features = ["revision", "merge", "blob-diff", "blame", "attributes", "status", "worktree-mutation", "blocking-network-client"] }
napi = { version = "3.14.2", features = ["serde-json"] }
napi-derive = "3.6.12"
futures = "0.3.34"
serde = { version = "1.0.154", features = ["derive"] }
serde_json = "1.0.154"
aes-gcm = "0.11.1"
rand = "0.10.3"
sha2 = "0.11.1"
hex = "0.4.3"
thiserror = "2.0.21"
age = { version = "0.12.1", optional = true }
rpassword = { version = "7.5.4", optional = true }
pgp = { version = "0.21.0", optional = true }

[build-dependencies]
napi-build = "2.6.0"

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
ssh = ["dep:age", "dep:rpassword", "age/ssh"]
gpg = ["dep:pgp"]
