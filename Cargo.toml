[package]
name = "repository"
version = "0.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
gix = "0.89.0"
napi = { version = "3.14.2", features = ["serde-json"] }
napi-derive = "3"
oxc = "0.152.0"
oxc_allocator = "0.152.0"
oxc_ast = { version = "0.152.0", features = ["serialize"] }
oxc_estree = { version = "0.152.0", features = ["serialize"] }
oxc_parser = "0.152.0"
oxc_span = "0.152.0"
serde_json = "1.0.154"

[build-dependencies]
napi-build = "2.6.0"
